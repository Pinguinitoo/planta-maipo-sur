name: seguridad-planta
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  buscar-secretos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Buscar secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Prueba funcional
        env:
          PYTHONPATH: ${{ github.workspace }}
          PLC_PASSWORD: ${{ secrets.PLC_PASSWORD }}
        run: python scripts/prueba_funcional.py

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Revisar codigo propio
        run: semgrep scan --config .semgrep.yml --error .
        
      
      - name: Revisar infraestructura con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          version: v0.75.0
          
      - name: Comprobar dependencias Python
        run: |
          echo "Revisando requirements.txt"
          if grep -Eq '^[[:space:]]*[^#[:space:]]' requirements.txt; then
            echo "Hay dependencias declaradas que requieren auditoria"
            exit 1
          else
            echo "Sin dependencias Python externas declaradas"
          fi
          
      - name: Generar SBOM con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          version: v0.75.0

      - name: Guardar SBOM como evidencia
        uses: actions/upload-artifact@v4
        with:
          name: sbom-planta-maipo-sur
          path: sbom.cdx.json
          if-no-files-found: error

